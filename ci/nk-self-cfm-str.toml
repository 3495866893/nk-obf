# nk_ad.c 自混淆配置（v12.13 候选：v12.12 三项 + 字符串加密）
# 相对 v12.12 只多一项 string_encryption，且 anti_dump = false：
#   anti_dump 会在函数退出时清零解密缓冲区，而判死原因串是跨函数传递的
#   （nk_hint_die(why) -> nk_die_r(why)），清零后打印出来的 reason 就是空串。
#   历史上「nk_ad[die] reason= 空」就是这么来的，所以这里必须关 anti_dump。
# 只开三项：常量加密（藏魔数/查表）、函数调用混淆（藏 call 目标）、MBA（藏算术语义）。
# 明确不开：bcf/split/indirect/flattening
# （在 nk_ad 上造成过构造函数 usleep 死循环与 worker 空指针间接调用）。
# 插件侧用 NK_SKIP_ADB=1，避免给 nk_ad 自己插 __nk_ad_check 调用。
# ⚠ 实验失败（2026-11-28）：真机 5/5 rc=124、输出 0 字节，构造函数阶段卡死。
#   结论：string_encryption 不能作用在 nk_ad.c 上（无论 anti_dump 开关）；
#   保留本文件仅作记录，构建脚本已回退到 nk-self-cfm.toml。
[global]
preset = ""
seed = "0xDEADBEEF"
verbose = false

[passes.string_encryption]
enabled = true
probability = 100
anti_dump = false
force_content = [".*"]

[passes.constant_encryption]
enabled = true
iterations = 2
share_count = 6
feistel = false
globalize = true
globalize_prob = 100
substitute_xor = true
substitute_xor_prob = 100
skip_value = ["^0x0$"]

[passes.substitution]
enabled = false
probability = 60
iterations = 1

[passes.bcf]
enabled = false
probability = 60
iterations = 1
complexity = 6
entropy_chain = false
junk_asm = false
nested = false
create_func = false

[passes.split_blocks]
enabled = false
splits = 3
stack_confusion = false

[passes.indirect_branch]
enabled = false
use_stack = true
enc_jump_target = true

[passes.flattening]
enabled = false
probability = 100

[passes.anti_debugging]
enabled = false
probability = 100

[passes.mba]
enabled = true
probability = 60
layers = 3
heuristic = true

[passes.chaos_state_machine]
enabled = false

[passes.vector_obfuscation]
enabled = false

[passes.function_wrapper]
enabled = false

[passes.function_call_obfuscate]
enabled = true

[passes.anti_hooking]
enabled = false

[passes.anti_class_dump]
enabled = false

[passes.objc]
enabled = false

