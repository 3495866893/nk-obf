name: artifacts-cleanup

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: prune artifacts (never touch llvm-build / ndk cache)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="$GITHUB_REPOSITORY"

          # 永远保留的名字前缀（构建缓存，删了就要重编 clang / 重下 NDK）
          KEEP_RE='^(llvm-build|ndk-.+-cache|ensia-plugin-.*)$'

          gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id,.name,.size_in_bytes,.created_at] | @tsv' > /tmp/a.tsv || true

          TOTAL=$(awk -F'\t' '{s+=$3} END{print s+0}' /tmp/a.tsv)
          echo "当前工件合计: $((TOTAL/1048576)) MB / $(wc -l < /tmp/a.tsv) 个"

          # 总量没到 300 MB 就不动（省得把有用的删光）
          if [ "$TOTAL" -lt $((300*1024*1024)) ]; then
            echo "未超过 300 MB，跳过清理"
            exit 0
          fi

          NOW=$(date -u +%s)
          CUT=$((NOW - 86400))          # 只删 1 天前的
          DEL=0
          while IFS=$'\t' read -r ID NAME SIZE CREATED; do
            [ -z "${ID:-}" ] && continue
            if echo "$NAME" | grep -Eq "$KEEP_RE"; then
              continue                  # 缓存类一律保留
            fi
            TS=$(date -u -d "$CREATED" +%s 2>/dev/null || echo "$NOW")
            if [ "$TS" -lt "$CUT" ]; then
              gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" >/dev/null 2>&1 \
                && echo "  删除 $NAME ($ID)"
              DEL=$((DEL+1))
            fi
          done < /tmp/a.tsv

          echo "共删除 $DEL 个"
          gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '[.artifacts[].size_in_bytes] | add // 0 | ./1048576 | floor' || true
