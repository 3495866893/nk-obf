name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: accept licenses & show sdk
        run: |
          ls /usr/local/lib/android/sdk
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: build debug apk
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NKBuild-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
