name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: build debug apk
        run: |
          set -o pipefail
          cd android
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1 || true
          echo "===== 错误（e: / error: / .kt:）====="
          grep -nE "^e: |error: |\.kt:[0-9]+" /tmp/build.log | head -60 || true
          echo "===== 结尾 ====="
          tail -30 /tmp/build.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: publish apk to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' android/app/build.gradle.kts | head -1)
          APK="/tmp/NKBuild-mobile-${VER}-kami.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          ls -l "$APK"
          for T in nk-builds "v${VER}" v1.0.2; do
            gh release view "$T" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$T" -R "$GITHUB_REPOSITORY" -t "$T" -n "NK $T"
            gh release upload "$T" "$APK" --clobber -R "$GITHUB_REPOSITORY" && echo "uploaded -> $T"
          done
          sha256sum "$APK" || true
            || { echo "upload failed"; gh auth status || true; exit 1; }
