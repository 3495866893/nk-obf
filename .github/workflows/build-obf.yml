name: build-obf

on:
  workflow_dispatch:
  push:
    paths:
      - "proj/**"
      - ".github/workflows/build-obf.yml"
      - "ci/**"

env:
  LLVM_VER: "21.1.8"
  WORK: /mnt/work

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: disk & deps
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake ccache xz-utils curl unzip zlib1g-dev
          sudo mkdir -p $WORK && sudo chown $(id -u):$(id -g) $WORK
          df -h / $WORK

      - name: restore llvm build
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: /mnt/work/llvm-build
          key: llvm-build-${{ env.LLVM_VER }}-v3

      - name: fetch llvm source
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -L --retry 3 -o $WORK/llvm.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VER }}/llvm-project-${{ env.LLVM_VER }}.src.tar.xz
          mkdir -p $WORK/llvm-src
          tar -xf $WORK/llvm.tar.xz -C $WORK/llvm-src --strip-components=1
          rm -f $WORK/llvm.tar.xz

      - name: configure llvm
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          set -eux
          cmake -S $WORK/llvm-src/llvm -B $WORK/llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF -DCLANG_ENABLE_ARCMT=OFF \
            -DLLVM_ENABLE_ZSTD=OFF

      - name: build clang
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          set -eux
          ninja -C $WORK/llvm-build clang llvm-config 2>&1 | tail -100
          ls -lh $WORK/llvm-build/bin/clang++

      - name: save llvm build cache
        if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /mnt/work/llvm-build
          key: llvm-build-${{ env.LLVM_VER }}-v3

      - name: unpack ensia kit
        run: |
          set -eux
          tar -xzf kit.tar.gz
          ls ensia/src | head

      - name: build ensia plugin (只编 Ensia 目标，跳过 Rust 变体)
        run: |
          set -eux
          cmake -S ensia/src -B $WORK/ensia-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$WORK/llvm-build/lib/cmake/llvm 2>&1 | tail -30
          ninja -C $WORK/ensia-build Ensia 2>&1 | tail -80
          find $WORK/ensia-build -name "*.so" -exec ls -lh {} \;
          OBJ=$(find $WORK/ensia-build -name "*.so" | head -1)
          nm -D "$OBJ" | grep -c llvmGetPassPluginInfo || true

      - name: fetch android ndk r29
        run: |
          set -eux
          curl -L --retry 3 -o $WORK/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q $WORK/ndk.zip -d $WORK
          rm -f $WORK/ndk.zip
          NDK_DIR=$(ls -d $WORK/android-ndk-r29*/ | head -1)
          echo "NDK_DIR=${NDK_DIR%/}" >> $GITHUB_ENV

      - name: build lucifer
        run: |
          set -eux
          export CLANG=$WORK/llvm-build/bin/clang++
          export LLVM_DIR=$WORK/llvm-build
          bash ci/build-lucifer.sh "$NDK_DIR" "$(find $WORK/ensia-build -name '*.so' | head -1)" lucifer 2>&1 | tail -120

      - name: verify
        if: always()
        run: |
          echo "=== 产物检查 ==="
          ls -l lucifer 2>/dev/null || echo "no binary"
          file lucifer 2>/dev/null || true
          if [ -f lucifer ]; then
            echo "体积: $(stat -c%s lucifer) 字节"
            echo "机器码: $(od -An -tu2 -j18 -N2 lucifer)  (183=AArch64)"
            echo "clang 指纹残留: $(strings lucifer | grep -ci 'clang version' || true)"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucifer-obf
          path: lucifer
          if-no-files-found: warn
